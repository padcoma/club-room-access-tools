<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Lounge Value Calculator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .calculator {
            max-width: 500px;
            width: 100%;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            padding: 30px;
            color: #333;
        }
        h1 {
            text-align: center;
            margin-top: 0;
            color: #1a2a6c;
            font-size: 1.8rem;
        }
        .subtitle {
            text-align: center;
            margin-bottom: 25px;
            color: #555;
            font-size: 0.95rem;
        }
        .input-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 4px;
            font-size: 0.9rem;
        }
        .currency-input {
            position: relative;
        }
        .currency-input span.currency {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            font-weight: bold;
            font-size: 1rem;
        }
        input[type="number"] {
            width: 100%;
            padding: 12px 12px 12px 35px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border 0.2s;
        }
        input[type="number"]:focus {
            outline: none;
            border-color: #b21f1f;
            box-shadow: 0 0 0 2px rgba(178,31,31,0.2);
        }
        .optional-toggle {
            margin: 20px 0;
            text-align: left;
            font-size: 0.9rem;
        }
        .optional-toggle label {
            display: inline;
            cursor: pointer;
        }
        .results {
            margin-top: 25px;
            background: #f9f9f9;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            font-weight: 600;
        }
        .savings {
            font-size: 2rem;
            color: #1a2a6c;
        }
        .savings.positive {
            color: #2e7d32;
        }
        .savings.negative {
            color: #c62828;
        }
        .btn {
            display: inline-block;
            margin-top: 10px;
            padding: 12px 25px;
            background: #b21f1f;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #8e0000;
        .book-btn {
            display: none;
            margin-top: 15px;
            padding: 12px 25px;
            background: #f5a623;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            transition: background 0.2s;
            font-size: 1rem;
        }
        .book-btn:hover {
            background: #d18d1c;
        }
        .details {
            font-size: 0.9rem;
            color: #555;
            margin-top: 10px;
        }
        .advanced {
            margin-top: 10px;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <h1>Executive Lounge Value</h1>
        <p class="subtitle">Compare costs: Standard Room + Amenities vs. Executive Room</p>
        
        <div class="input-group">
            <label for="stdRoom">Standard Room Price</label>
            <div class="currency-input">
                <span class="currency">$</span>
                <input type="number" id="stdRoom" placeholder="0.00" step="0.01" min="0">
            </div>
        </div>
        
        <div class="input-group">
            <label for="execRoom">Executive Room Price</label>
            <div class="currency-input">
                <span class="currency">$</span>
                <input type="number" id="execRoom" placeholder="0.00" step="0.01" min="0">
            </div>
        </div>
        
        <h3 style="margin-bottom:10px; color:#666;">Amenity Costs (per night)</h3>
        
        <div class="input-group">
            <label for="breakfast">Breakfast</label>
            <div class="currency-input">
                <span class="currency">$</span>
                <input type="number" id="breakfast" placeholder="0.00" step="0.01" min="0" value="20">
            </div>
        </div>
        
        <div class="input-group">
            <label for="lunch">Lunch</label>
            <div class="currency-input">
                <span class="currency">$</span>
                <input type="number" id="lunch" placeholder="0.00" step="0.01" min="0" value="15">
            </div>
        </div>
        
        <div class="input-group">
            <label for="cocktailDrinks">Cocktail Drinks</label>
            <div class="currency-input">
                <span class="currency">$</span>
                <input type="number" id="cocktailDrinks" placeholder="0.00" step="0.01" min="0" value="30">
            </div>
        </div>
        
        <div class="input-group">
            <label for="cocktailSnacks">Cocktail Snacks</label>
            <div class="currency-input">
                <span class="currency">$</span>
                <input type="number" id="cocktailSnacks" placeholder="0.00" step="0.01" min="0" value="15">
            </div>
        </div>
        
        <div class="input-group">
            <label for="dailySnack">Daily Snacks</label>
            <div class="currency-input">
                <span class="currency">$</span>
                <input type="number" id="dailySnack" placeholder="0.00" step="0.01" min="0" value="10">
            </div>
        </div>
        
        <div class="input-group">
            <label for="softDrinks">Soft Drinks</label>
            <div class="currency-input">
                <span class="currency">$</span>
                <input type="number" id="softDrinks" placeholder="0.00" step="0.01" min="0" value="5">
            </div>
        </div>
        
        <div class="input-group">
            <label for="laundry">Laundry</label>
            <div class="currency-input">
                <span class="currency">$</span>
                <input type="number" id="laundry" placeholder="0.00" step="0.01" min="0" value="15">
            </div>
        </div>
        
        <div class="input-group">
            <label for="meetingRoom">Meeting Room (per hour)</label>
            <div class="currency-input">
                <span class="currency">$</span>
                <input type="number" id="meetingRoom" placeholder="0.00" step="0.01" min="0" value="30">
            </div>
        </div>
        
        <div class="optional-toggle">
            <input type="checkbox" id="showAdvanced" onchange="toggleAdvanced()">
            <label for="showAdvanced">Add more variables</label>
        </div>
        
        <div id="advancedFields" class="hidden">
            <div class="input-group">
                <label for="other1">Other Amenity 1</label>
                <div class="currency-input">
                    <span class="currency">$</span>
                    <input type="number" id="other1" placeholder="0.00" step="0.01" min="0">
                </div>
            </div>
            <div class="input-group">
                <label for="other2">Other Amenity 2</label>
                <div class="currency-input">
                    <span class="currency">$</span>
                    <input type="number" id="other2" placeholder="0.00" step="0.01" min="0">
                </div>
            </div>
            <div class="input-group">
                <label for="other3">Other Amenity 3</label>
                <div class="currency-input">
                    <span class="currency">$</span>
                    <input type="number" id="other3" placeholder="0.00" step="0.01" min="0">
                </div>
            </div>
        </div>
        
        <button class="btn" onclick="calculate()">Calculate Savings</button>
        
        <div class="results" id="results" style="display:none;">
            <div>Daily Total with Standard Room: <span id="totalStandard">$0.00</span></div>
            <div style="margin-top:8px;">Executive Room Price: <span id="execPriceDisplay">$0.00</span></div>
            <div style="margin-top:12px;" id="savingsArea">
                You could <strong id="saveVerb">save</strong> <span class="savings" id="savingsAmount">$0.00</span> per night.
            </div>
            <div class="details" id="savingsDetail"></div>
            <a class="book-btn" id="bookBtn" href="https://expedia.com/affiliate/uQWHT1g" target="_blank" rel="noopener noreferrer">Book on Expedia</a>
        </div>
    </div>
    
    <script>
        function getVal(id) {
            return parseFloat(document.getElementById(id).value) || 0;
        }
        function calc() {
            const stdRoom = getVal('stdRoom');
            const execRoom = getVal('execRoom');
            const extras = getVal('breakfast') + getVal('lunch') + getVal('cocktailDrinks') + getVal('cocktailSnacks') + getVal('dailySnack') + getVal('softDrinks') + getVal('laundry') + getVal('meetingRoom') + getVal('other1') + getVal('other2') + getVal('other3');
            const totalStandard = stdRoom + extras;
            const diff = totalStandard - execRoom;
            return {totalStandard, execRoom, diff};
        }
        function calculate() {
            const {totalStandard, execRoom, diff} = calc();
            document.getElementById('results').style.display = 'block';
            document.getElementById('bookBtn').style.display = 'inline-block';
            document.getElementById('totalStandard').textContent = '$' + totalStandard.toFixed(2);
            document.getElementById('execPriceDisplay').textContent = '$' + execRoom.toFixed(2);
            const savingsEl = document.getElementById('savingsAmount');
            const saveVerb = document.getElementById('saveVerb');
            const savingsArea = document.getElementById('savingsArea');
            const details = document.getElementById('savingsDetail');
            if (diff > 0) {
                savingsEl.textContent = '$' + diff.toFixed(2);
                savingsEl.className = 'savings positive';
                saveVerb.textContent = 'save';
                details.textContent = 'Booking the executive room is cheaper than paying for amenities separately.';
            } else if (diff < 0) {
                savingsEl.textContent = '$' + Math.abs(diff).toFixed(2);
                savingsEl.className = 'savings negative';
                saveVerb.textContent = 'lose';
                details.textContent = 'You would pay more for the executive room; sticking with standard + amenities is cheaper.';
            } else {
                savingsEl.textContent = '$0.00';
                savingsEl.className = 'savings';
                saveVerb.textContent = 'break even';
                details.textContent = 'Costs are equal either way.';
            }
        }
        function toggleAdvanced() {
            const adv = document.getElementById('advancedFields');
            adv.classList.toggle('hidden');
        }
    </script>
</body>
</html>
